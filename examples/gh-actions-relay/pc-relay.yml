# Copy to  .github/workflows/pc-relay.yml  in a **PRIVATE** repository.
# Do NOT enable it in a public repo: Actions logs of public repos are public.
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   PC1_DESKTOP_TOKEN          desktop_token from pc1's machine.json
#   CF_ACCESS_CLIENT_ID        optional, only if Cloudflare Access is enabled
#   CF_ACCESS_CLIENT_SECRET    optional
# Variables (same page -> Variables):
#   PC1_URL                    https://<pc1 hostname>/desktop/mcp
#
# Trigger:  gh workflow run pc-relay.yml -f task=list_tools
name: pc-relay

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Whitelisted task (phase 1 = read-only)"
        type: choice
        options: [list_tools, read_start_here, verify]
        default: list_tools

permissions:
  contents: read

concurrency:            # never two sessions on the same PC at once
  group: pc1
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pc1    # add "required reviewers" here to approve every run
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install client deps (httpx2, not httpx)
        run: pip install --disable-pip-version-check "mcp==2.2.0" "httpx2==2.13.1"

      - name: Run task
        env:
          PC_URL: ${{ vars.PC1_URL }}
          PC_TOKEN: ${{ secrets.PC1_DESKTOP_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TASK: ${{ inputs.task }}     # via env, never interpolated into the script
        run: python relay/relay_client.py "$TASK" --out out/result.md

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc1-${{ inputs.task }}-${{ github.run_id }}
          path: out/
          retention-days: 1
          if-no-files-found: ignore
