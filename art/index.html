<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #3d3529;
    --muted: #8a7a63;
    --card: #fffdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #FFF6E6 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #FFE9CE 0%, transparent 55%),
      #FAF0DF;
  }
  .wrap { width: min(920px, 100%); }
  header { text-align: center; margin-bottom: 18px; }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 3.4vw, 32px);
    letter-spacing: .02em;
  }
  h1 span { color: var(--muted); font-weight: 400; font-size: .55em; margin-left: .5em; }
  p.sub { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border-radius: 26px;
    padding: 14px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.8) inset,
      0 18px 50px -18px rgba(120, 88, 40, .35),
      0 2px 8px rgba(120, 88, 40, .06);
    overflow: hidden;
  }
  .stage { border-radius: 16px; overflow: hidden; display: block; background: #FDEBD2; }
  .stage svg { display: block; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 8px 4px; flex-wrap: wrap;
  }
  .hint { color: var(--muted); font-size: 13px; }
  .hint code { background: #F4EADA; padding: 1px 6px; border-radius: 6px; font-size: 12px; }
  .actions { display: flex; gap: 8px; }
  button, a.btn {
    font: inherit; font-size: 13px;
    text-decoration: none; display: inline-block; line-height: normal;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid #E4D6BF;
    background: #FFF8EC;
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  button:hover, a.btn:hover { background: #FFF1DC; box-shadow: 0 4px 12px rgba(150,110,50,.12); }
  button:active, a.btn:active { transform: translateY(1px); }
  button[aria-pressed="true"] { background: #F6E3C6; border-color: #DFC79C; }
  .paused * { animation-play-state: paused !important; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #3d3529; }
  }
</style>
</head>

</defs>

<style>
  .spin     { animation: spin 0.7s linear infinite; }
  .crank    { animation: spin 1.2s linear infinite; }
  .pedal    { animation: spin-rev 1.2s linear infinite; }
  .spokes, .crank, .pedal { transform-box: view-box; }
  .static .crank, .static .pedal { animation: none; }
  #rear-wheel .spokes  { transform-origin: 280.0px 398.0px; }
  #front-wheel .spokes { transform-origin: 600.0px 398.0px; }
  #crank-near, #crank-far { transform-origin: 425.0px 410.0px; }
  /* pedals orbit with the crank but stay level: counter-rotate about their own centre */
  #pedal-near, #pedal-far { transform-origin: 425.0px 384.0px; }
  @keyframes spin     { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spin-rev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  .cloud    { animation: drift 34s linear infinite; }
  @keyframes drift { from { transform: translateX(0px); } to { transform: translateX(-900px); } }
  .road-dash { animation: dash 1.2s linear infinite; }
  @keyframes dash { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  .bob      { animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(2.4px); } }
  .wing     { animation: flap 1.2s ease-in-out infinite;
               transform-origin: 392px 202px; transform-box: view-box; }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-2deg); } }
  .scarf    { animation: flutter 0.55s ease-in-out infinite alternate;
               transform-origin: 404px 200px; transform-box: view-box; }
  @keyframes flutter { from { transform: rotate(-3.5deg); } to { transform: rotate(4deg); } }
  .puff     { animation: puff 1.2s linear infinite; transform-box: view-box; }
  @keyframes puff {
      0%   { opacity: 0;    transform: translate(0,0) scale(0.4); }
      25%  { opacity: 0.5; }
      100% { opacity: 0;    transform: translate(-74px,-14px) scale(1.6); }
  }
  .whoosh   { animation: whoosh 0.95s linear infinite; }
  @keyframes whoosh {
      0%   { opacity: 0;    transform: translateX(30px); }
      30%  { opacity: 0.55; }
      100% { opacity: 0;    transform: translateX(-64px); }
  }
  .blink  { animation: blink 4.7s infinite; transform-box: view-box;
             transform-origin: 487px 129px; }
  @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
  }
  .shadow { animation: squash 1.2s ease-in-out infinite;
             transform-box: view-box; transform-origin: 440px 470px; }
  @keyframes squash { 0%,100% { transform: scale(1); } 50% { transform: scale(0.975,1); } }
  .static .cloud, .static .road-dash, .static .whoosh, .static .puff,
  .static .bob, .static .wing, .static .scarf, .static .blink,
  .static .shadow, .static .spin { animation: none; }
  @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
</style>
