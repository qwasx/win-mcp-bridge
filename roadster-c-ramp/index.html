<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>夜间实拍 · Roadster C 形坡道倒挂释放与冷气回正着陆</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  #app { position: fixed; inset: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* 扫描线 */
  #scan {
    position: absolute; inset: 0; z-index: 16; pointer-events: none; opacity: .05;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px);
  }
  #ui {
    position: absolute; right: 16px; bottom: 16px; z-index: 40; display: flex; gap: 8px; align-items: center;
  }
  .btn {
    appearance: none; border: 1px solid rgba(127,216,255,.4); color: #cfeaff; cursor: pointer;
    background: rgba(8,14,22,.6); border-radius: 999px; padding: 8px 16px;
    font: 600 13px/1 'PingFang SC','Microsoft YaHei',sans-serif; backdrop-filter: blur(4px);
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(24,40,60,.75); border-color: rgba(127,216,255,.8); }
  #hint {
    position: absolute; left: 18px; bottom: 14px; z-index: 40; pointer-events: none;
    color: rgba(160,190,215,.5); font: 12px/1.4 'SF Mono',Menlo,Consolas,monospace;
  }
</style>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="scan"></div>
    <div id="ui"></div>
    <div id="hint">SPACE 暂停 · R 重播 · C 自由视角</div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
