# net-relay: 让只能访问 GitHub 的 AI 沙箱借 GitHub Actions 访问外网。
# 说明见 netrelay/README.md。
#
# 本仓库是公开的，所以：
#   * 返回内容一律不打印到日志；
#   * 结果用请求方的一次性 RSA 公钥加密后，提交为 netrelay/results/<id>.enc；
#   * 请求里没有公钥就拒绝执行。
# 只在 push 触发（fork 的 PR 不会触发），并且只在本仓库运行。
name: net-relay

on:
  push:
    paths:
      - netrelay/request.json

permissions:
  contents: write          # 仅用于把加密结果提交回同一分支

concurrency:
  group: netrelay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'qwasx/win-mcp-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: pip install -q cryptography

      - name: Run jobs (output is NOT printed)
        run: python netrelay/runner.py netrelay/request.json

      - name: Commit sealed result
        run: |
          id=$(python -c "import json;print(json.load(open('netrelay/request.json')).get('id') or '')")
          f="netrelay/results/$id.enc"
          if [ -z "$id" ] || [ ! -f "$f" ]; then echo "没有结果需要提交"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$f"
          git commit -q -m "netrelay: result $id"
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已提交 $(stat -c %s "$f") 字节"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "推送失败"; exit 1
