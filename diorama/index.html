<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>雨の夜のコンビニ角 — Rainy Night Convenience Store Corner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07080d;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6f7ba0;
        font: 13px/1.6 "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
        letter-spacing: 0.22em;
        background: #07080d;
        transition: opacity 0.8s ease;
        pointer-events: none;
        user-select: none;
      }
      #boot.gone {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">LOADING…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
